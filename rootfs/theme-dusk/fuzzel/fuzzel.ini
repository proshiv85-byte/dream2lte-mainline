# App launcher, dusk theme
[main]
font=JetBrains Mono:size=10:weight=semibold
prompt="  "
icons-enabled=yes
icon-theme=Adwaita
terminal=foot -e
layer=overlay
lines=9
width=30
line-height=30
horizontal-pad=18
vertical-pad=14
inner-pad=10
anchor=center
image-size-ratio=0.4

[colors]
background=0f0c18eb
text=c9c2dcff
prompt=b4a4f2ff
placeholder=6e6787ff
input=f6f2fbff
match=f4a98cff
selection=2a2440ff
selection-text=f6f2fbff
selection-match=ffd59eff
counter=6e6787ff
border=b4a4f2cc

[border]
width=2
radius=18
selection-radius=12
