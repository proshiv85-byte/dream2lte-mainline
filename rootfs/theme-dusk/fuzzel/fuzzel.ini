# App launcher, dusk (minimal): text only
[main]
font=JetBrains Mono:size=10,Symbols Nerd Font:size=10
prompt="> "
icons-enabled=no
terminal=foot -e
layer=overlay
lines=10
width=28
line-height=28
horizontal-pad=14
vertical-pad=10
inner-pad=8
anchor=center

[colors]
background=111013f5
text=b9b5bdff
prompt=5d5a63ff
placeholder=5d5a63ff
input=f0edf2ff
match=d9a48fff
selection=222026ff
selection-text=f0edf2ff
selection-match=e8b8a4ff
counter=5d5a63ff
border=2a282eff

[border]
width=1
radius=4
selection-radius=2
